plugins {
    id 'com.android.application'
}

def releaseVersionCode = (project.findProperty('METROM_VERSION_CODE') ?: '1').toString().toInteger()
def releaseVersionName = (project.findProperty('METROM_VERSION_NAME') ?: '1.0.0').toString()

def ksFile = System.getenv('METROM_KEYSTORE_FILE')
def ksPassword = System.getenv('METROM_KEYSTORE_PASSWORD')
def ksAlias = System.getenv('METROM_KEY_ALIAS')
def keyPassword = System.getenv('METROM_KEY_PASSWORD')
def hasReleaseSigning = ksFile && ksPassword && ksAlias && keyPassword

android {
    namespace 'ir.msbmusic.metrom'
    compileSdk 36

    defaultConfig {
        applicationId 'ir.msbmusic.metrom'
        minSdk 23
        targetSdk 36
        versionCode releaseVersionCode
        versionName releaseVersionName

    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(ksFile)
                storePassword ksPassword
                keyAlias ksAlias
                keyPassword keyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }

    packaging {
        resources.excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*'
        ]
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.10.0'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
}
