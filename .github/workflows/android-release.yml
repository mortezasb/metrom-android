name: Build Signed Release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Android versionCode (must increase every store release)
        required: true
        default: '1'
      version_name:
        description: Version name
        required: true
        default: '1.0.0'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      METROM_KEYSTORE_FILE: ${{ github.workspace }}/app/metrom-upload.jks
      METROM_KEYSTORE_PASSWORD: ${{ secrets.METROM_KEYSTORE_PASSWORD }}
      METROM_KEY_ALIAS: ${{ secrets.METROM_KEY_ALIAS }}
      METROM_KEY_PASSWORD: ${{ secrets.METROM_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore release keystore
        env:
          METROM_KEYSTORE_BASE64: ${{ secrets.METROM_KEYSTORE_BASE64 }}
        run: |
          test -n "$METROM_KEYSTORE_BASE64" || (echo "Missing METROM_KEYSTORE_BASE64" && exit 1)
          test -n "$METROM_KEYSTORE_PASSWORD" || (echo "Missing METROM_KEYSTORE_PASSWORD" && exit 1)
          test -n "$METROM_KEY_ALIAS" || (echo "Missing METROM_KEY_ALIAS" && exit 1)
          test -n "$METROM_KEY_PASSWORD" || (echo "Missing METROM_KEY_PASSWORD" && exit 1)
          printf '%s' "$METROM_KEYSTORE_BASE64" | base64 --decode > "$METROM_KEYSTORE_FILE"

      - name: Build signed AAB and APK
        run: |
          gradle --no-daemon --stacktrace --warning-mode all clean :app:lintRelease :app:bundleRelease :app:assembleRelease \
            -PMETROM_VERSION_CODE=${{ inputs.version_code }} \
            -PMETROM_VERSION_NAME=${{ inputs.version_name }}

      - name: Verify signing and create release report
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee signing-report.txt
          sha256sum app/build/outputs/apk/release/app-release.apk > release-sha256.txt
          sha256sum app/build/outputs/bundle/release/app-release.aab >> release-sha256.txt

      - name: Upload Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: metrom-${{ inputs.version_name }}-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: metrom-${{ inputs.version_name }}-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30


      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: metrom-${{ inputs.version_name }}-release-info
          path: |
            signing-report.txt
            release-sha256.txt
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 30
